name: Docs index

on:
  schedule:
    # Mondays at 04:17 UTC.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Build the index
        run: node dist/src/cli.js build
        env:
          OUTPUT_DIR: ${{ runner.temp }}/index

      - name: Publish to the index branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          scripts/publish-index.sh "$RUNNER_TEMP/index" index
